  <circle class="star" cx="731.9" cy="28.4" r="1.41" fill="#e8defc" style="animation-duration:2.48s; animation-delay:2.22s;"/>
  <circle class="star" cx="153.8" cy="107.7" r="2.57" fill="#ffffff" style="animation-duration:2.66s; animation-delay:1.09s;"/>
  <circle class="star" cx="138.5" cy="80.1" r="1.5" fill="#ffffff" style="animation-duration:3.29s; animation-delay:0.57s;"/>
  <circle class="star" cx="258.0" cy="195.9" r="1.64" fill="#c9a7ff" style="animation-duration:3.04s; animation-delay:3.2s;"/>
