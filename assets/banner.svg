<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" role="img" aria-label="Maria Clara">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes twinkleSlow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
    .star { animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle { animation-name: twinkleSlow; animation-timing-function: ease-in-out; animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
    .name { animation: drift 6s ease-in-out infinite; }
  </style>

  <rect width="1200" height="220" fill="url(#sky)"/>

  <circle cx="1090" cy="58" r="60" fill="url(#moonGlow)"/>
  <circle cx="1090" cy="58" r="24" fill="#f5f3ff"/>
  <circle cx="1101" cy="49" r="21" fill="#302b63"/>

  <circle class="star" cx="395.6" cy="43.7" r="2.08" fill="#e8defc" style="animation-duration:1.93s; animation-delay:1.88s;"/>
