<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" role="img" aria-label="Maria Clara Almeida Martins">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes twinkleSlow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
    .star { animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle { animation-name: twinkleSlow; animation-timing-function: ease-in-out; animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
    .name { animation: drift 6s ease-in-out infinite; }
  </style>

  <rect width="1200" height="220" fill="url(#sky)"/>

  <circle cx="1090" cy="58" r="60" fill="url(#moonGlow)"/>
  <circle cx="1090" cy="58" r="24" fill="#f5f3ff"/>
  <circle cx="1101" cy="49" r="21" fill="#302b63"/>

  <circle class="star" cx="395.6" cy="43.7" r="2.08" fill="#e8defc" style="animation-duration:1.93s; animation-delay:1.88s;"/>
  <circle class="star" cx="696.0" cy="187.8" r="1.42" fill="#ffffff" style="animation-duration:1.95s; animation-delay:1.46s;"/>
  <circle class="star" cx="125.2" cy="95.7" r="2.34" fill="#c9a7ff" style="animation-duration:2.02s; animation-delay:0.78s;"/>
  <circle class="star" cx="696.3" cy="26.8" r="1.98" fill="#c9a7ff" style="animation-duration:1.89s; animation-delay:0.77s;"/>
  <circle class="star" cx="1015.8" cy="70.0" r="1.32" fill="#c9a7ff" style="animation-duration:2.01s; animation-delay:1.08s;"/>
  <circle class="star" cx="229.6" cy="125.5" r="2.06" fill="#ffffff" style="animation-duration:2.47s; animation-delay:1.92s;"/>
  <circle class="star" cx="308.2" cy="49.2" r="2.27" fill="#e8defc" style="animation-duration:1.95s; animation-delay:1.05s;"/>
  <circle class="star" cx="1035.2" cy="153.6" r="1.53" fill="#e8defc" style="animation-duration:3.56s; animation-delay:0.41s;"/>
  <circle class="star" cx="211.4" cy="80.0" r="2.5" fill="#ffffff" style="animation-duration:2.56s; animation-delay:3.37s;"/>
  <circle class="star" cx="994.4" cy="194.5" r="1.81" fill="#c9a7ff" style="animation-duration:3.0s; animation-delay:0.21s;"/>
  <circle class="star" cx="851.3" cy="183.5" r="1.62" fill="#c9a7ff" style="animation-duration:3.49s; animation-delay:1.24s;"/>
  <circle class="star" cx="155.8" cy="26.2" r="2.25" fill="#e8defc" style="animation-duration:2.03s; animation-delay:0.87s;"/>
  <circle class="star" cx="213.0" cy="91.3" r="1.52" fill="#c9a7ff" style="animation-duration:2.05s; animation-delay:1.51s;"/>
  <circle class="star" cx="436.2" cy="183.0" r="2.54" fill="#ffffff" style="animation-duration:2.07s; animation-delay:0.62s;"/>
  <circle class="star" cx="783.9" cy="17.3" r="2.35" fill="#ffffff" style="animation-duration:2.13s; animation-delay:0.99s;"/>
  <circle class="star" cx="677.0" cy="196.1" r="2.14" fill="#c9a7ff" style="animation-duration:2.73s; animation-delay:2.16s;"/>
  <circle class="star" cx="1030.3" cy="195.9" r="2.12" fill="#e8defc" style="animation-duration:2.81s; animation-delay:1.39s;"/>
  <circle class="star" cx="140.1" cy="135.5" r="1.19" fill="#ffffff" style="animation-duration:1.92s; animation-delay:0.73s;"/>
