  <path class="sparkle" d="M120 88 C122 93, 122 93, 127 95 C122 97, 122 97, 120 102 C118 97, 118 97, 113 95 C118 93, 118 93, 120 88 Z" fill="#e8defc" style="animation-duration:3.2s; animation-delay:0.2s;"/>
  <path class="sparkle" d="M1080 144 C1082 148, 1082 148, 1086 150 C1082 152, 1082 152, 1080 156 C1078 152, 1078 152, 1074 150 C1078 148, 1078 148, 1080 144 Z" fill="#c9a7ff" style="animation-duration:2.8s; animation-delay:1.1s;"/>
  <path class="sparkle" d="M990 60 C992 63, 992 63, 995 65 C992 67, 992 67, 990 70 C988 67, 988 67, 985 65 C988 63, 988 63, 990 60 Z" fill="#ffffff" style="animation-duration:3.6s; animation-delay:0.6s;"/>

  <text class="name" x="600.0" y="128" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Verdana, sans-serif" font-size="42" font-weight="700"
        fill="#ffffff" filter="url(#softGlow)">Maria Clara Almeida Martins</text>
</svg>
