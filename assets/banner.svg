  <text class="name" x="600.0" y="128" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Verdana, sans-serif" font-size="56" font-weight="700"
        fill="#ffffff" filter="url(#softGlow)">Maria Clara</text>
</svg>
